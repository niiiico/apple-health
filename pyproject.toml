[project]
name = "apple-health"
version = "0.1.0"
description = "Parse an Apple Health export into a queryable SQLite dataset and report training stats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Visualisation extras (route heatmap, plots) — not needed for the core parser/report.
viz = ["folium>=0.16", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
# Sources and commands keep their established names; the sinks gain them so
# nothing is invoked as `python tools/<script>.py` any more (ADR-006).
ah-build = "apple_health.commands.build:main"
ah-sync = "apple_health.commands.sync:main"
ah-ingest = "apple_health.sources.healthsync:main"
ah-fetch = "apple_health.sources.icloud:main"
ah-report = "apple_health.sinks.markdown_report:main"
ah-html = "apple_health.sinks.html_report:main"
ah-sessions = "apple_health.sinks.session_files:main"
ah-vault = "apple_health.sinks.vault_box:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
