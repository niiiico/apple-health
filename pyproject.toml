[project]
name = "apple-health"
version = "0.1.0"
description = "Parse an Apple Health export into a queryable SQLite dataset and report training stats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Postgres store (ADR-006). Nothing imports it yet, and the launchd Mac path
# only ever touches SQLite, so it stays out of the core install.
pg = ["psycopg[binary]>=3.2"]
# Visualisation extras (route heatmap, plots) — not needed for the core parser/report.
viz = ["folium>=0.16", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
# Sources and commands keep their established names; the sinks gain them so
# nothing is invoked as `python tools/<script>.py` any more (ADR-006).
ah-build = "apple_health.commands.build:main"
ah-sync = "apple_health.commands.sync:main"
ah-ingest = "apple_health.sources.healthsync:main"
ah-fetch = "apple_health.sources.icloud:main"
ah-report = "apple_health.sinks.markdown_report:main"
ah-html = "apple_health.sinks.html_report:main"
ah-sessions = "apple_health.sinks.session_files:main"
ah-vault = "apple_health.sinks.vault_box:main"
ah-races = "apple_health.sinks.race_files:main"
ah-migrate = "apple_health.commands.migrate:main"
ah-pgsync = "apple_health.commands.pgsync:main"
ah-web = "apple_health.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health"]

[tool.hatch.build.targets.wheel.force-include]
"src/apple_health/ui_template.html" = "apple_health/ui_template.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
