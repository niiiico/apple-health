<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Without lang, iOS Safari keeps offering to translate a page already in the
     reader's language. -->
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<title>health — ce que le capteur n'enregistre pas</title>
<style>
  :root {
    --bg:#faf9f7; --panel:#fff; --ink:#1c1b19; --muted:#6b6862;
    --line:#e5e1da; --accent:#b4552d; --ok:#2f7d4f; --warn:#9a6a00;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#16151a; --panel:#1e1d23; --ink:#ece9e4; --muted:#9a958d;
    --line:#302e36; --accent:#e08b5f; --ok:#5fbe86; --warn:#d5a441;
    /* White on this accent is 2.6:1 — under AA, on every primary button, on a
       phone read outdoors after training. Dark ink on it is about 7:1. */
    --on-accent:#16151a;
  } }
  :root { --on-accent:#fff }
  * { box-sizing:border-box }
  body { margin:0; padding:1.5rem 1rem 4rem; background:var(--bg); color:var(--ink);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto }
  /* One bar on every page. Navigation was a scattering of "← retour" links that
     only went where you had just been, so reaching the plan from a session took
     three taps through pages you did not want. */
  .topnav { max-width:900px; margin:0 auto 1.4rem; display:flex; flex-wrap:wrap;
            gap:.15rem; border-bottom:1px solid var(--line); padding-bottom:.5rem }
  .topnav a { padding:.5rem .7rem; text-decoration:none; color:var(--muted);
              font-size:.9rem; font-weight:600; border-radius:6px; min-height:44px;
              display:flex; align-items:center }
  .topnav a:hover { color:var(--ink); background:var(--panel) }
  .topnav a[aria-current] { color:var(--accent); background:var(--panel) }
  h1 { font-size:1.3rem; margin:0 0 .25rem }
  h2 { font-size:1rem; margin:2rem 0 .6rem; letter-spacing:.02em;
       text-transform:uppercase; color:var(--muted) }
  a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px }
  a:hover { text-decoration-thickness:2px }
  a.btn, a.chatrow { color:inherit; text-decoration:none }
  a.chatrow .q { color:var(--accent) }
  .cov { font-size:.85rem; color:var(--muted); margin:0 0 1.5rem }
  .cov b { color:var(--ink); font-weight:600 }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:.85rem 1rem; margin-bottom:.6rem }
  .row { display:flex; gap:.75rem; align-items:baseline; flex-wrap:wrap }
  .row .when { font-variant-numeric:tabular-nums; font-weight:600; min-width:6.2rem }
  .row .act { color:var(--accent); font-weight:600 }
  .row .stat { color:var(--muted); font-size:.9rem }
  .flag { font-size:.72rem; padding:.05rem .4rem; border-radius:99px;
          border:1px solid var(--line); color:var(--muted) }
  /* 16px, not inherit: below that iOS Safari zooms on focus and does not zoom
     back, on the most-repeated interaction here. maximum-scale would fix it and
     break pinch-zoom on the route maps. */
  textarea, input, select { width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:7px;
    padding:.45rem .55rem; margin-top:.5rem }
  textarea { min-height:2.6rem; resize:vertical }
  button { font:inherit; font-weight:600; color:var(--on-accent); background:var(--accent);
    border:0; border-radius:7px; padding:.45rem .9rem; cursor:pointer; margin-top:.5rem }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line) }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:.5rem }
  table { width:100%; border-collapse:collapse; font-size:.9rem }
  th,td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line) }
  th { color:var(--muted); font-weight:600 }
  .note { color:var(--muted); font-size:.85rem; margin:.4rem 0 0 }
  .saved { color:var(--ok) } .warn { color:var(--warn) }
  footer { margin-top:3rem; color:var(--muted); font-size:.8rem }
  a.btn { display:inline-block; text-decoration:none; font-weight:600; font-size:.85rem;
          color:var(--muted); border:1px solid var(--line); border-radius:7px;
          padding:.55rem .8rem; min-height:44px; line-height:1.85 }
  button.ghost { background:none; color:var(--muted); border:1px solid var(--line);
                 font-weight:500 }
  a.btn:hover { color:var(--ink); border-color:var(--accent) }
  a.detail { margin-left:auto }
  .nav .row { align-items:center }
  .nav form.range { display:flex; gap:.4rem; align-items:center; flex:1 }
  .nav form.range input { margin-top:0; width:auto; flex:1 }
  .nav form.range button { margin-top:0 }
  .transcript { max-height:26rem; overflow-y:auto; margin-bottom:.6rem }
  .transcript.past { max-height:none; margin-top:.6rem }
  /* The landing page shows one exchange, clipped. The sessions are the point of
     that page; a full transcript above them would undo the reordering. */
  .transcript.last { max-height:11rem; position:relative;
                     mask-image:linear-gradient(#000 70%, transparent) }
  /* Two native date inputs plus a button need ~295px of hard minimum in a 311px
     box on a 375px phone — it fits today with nothing to spare. Wrapping costs
     nothing and removes the cliff. */
  .nav form.range { flex-wrap:wrap }
  .nav form.range input { min-width:8.5rem }
  details summary { cursor:pointer; font-weight:600 }
  .transcript:empty { display:none }
  .turn { white-space:pre-wrap; padding:.5rem .7rem; border-radius:6px; margin:.4rem 0 }
  .turn.you { background:var(--accent-bg, rgba(127,127,127,.12)); font-weight:600 }
  .turn.claude { background:transparent }
  .turn.live { opacity:.75 }
  .reflection { border-left:2px solid var(--line); padding:.2rem 0 .2rem .7rem;
                margin:.4rem 0; font-size:.85rem; color:var(--muted) }
  .reflection.done { border-left:none; padding-left:0; margin-top:.6rem }
  .reflection .step { padding:.15rem 0 }
  .reflection .step.tool::before { content:"› "; opacity:.6 }
  .reflection .step.text { color:var(--ink) }
  .changes { margin:.5rem 0 .2rem; padding:.5rem .7rem; border-radius:6px;
             border:1px solid var(--accent); font-size:.9rem }
  .changes .change { color:var(--accent); font-weight:600 }
  .reflection code { display:block; font-size:.85em; opacity:.65;
                     word-break:break-all }
  button.link { background:none; border:none; padding:0 0 0 .5rem; margin:0;
                font:inherit; font-size:.85em; opacity:.65; cursor:pointer;
                text-decoration:underline; width:auto }
  .transcript.full { max-height:none }
  .chatrow { display:flex; align-items:center; gap:.6rem; padding:.6rem .2rem;
             border-bottom:1px solid rgba(127,127,127,.25) }
  .chatrow:last-child { border-bottom:none }
  .chatrow a { flex:1; display:flex; flex-direction:column; gap:.15rem;
               text-decoration:none; color:inherit; min-width:0 }
  .chatrow .q { font-weight:600; color:var(--accent) }
  .chatrow button { width:auto; margin:0; flex:none }
  .doc { white-space:pre-wrap; line-height:1.5 }
  .cals { display:flex; flex-wrap:wrap; gap:1.2rem }
  .month h3 { font-size:.85rem; margin:0 0 .4rem; color:var(--muted);
              text-transform:capitalize; font-weight:600 }
  .grid7 { display:grid; grid-template-columns:repeat(7,1fr); gap:2px;
           min-width:15rem }
  .cal { aspect-ratio:1; display:flex; flex-direction:column; align-items:center;
         justify-content:center; border-radius:4px; font-size:.7rem;
         color:var(--muted); background:var(--bg) }
  .cal.pad { background:none }
  .cal.has { background:var(--accent); color:var(--on-accent); font-weight:700;
             text-decoration:none }
  .cal span { font-size:.6rem; letter-spacing:.04em }
  svg.route { width:100%; max-width:26rem; height:auto; display:block; margin:0 auto .6rem }
  .mapwrap { width:100%; max-width:30rem; margin:0 auto .4rem; overflow:hidden;
             border-radius:8px; container-type:inline-size }
  .tiles { position:relative; transform-origin:top left }
  .tiles img { position:absolute; display:block; max-width:none }
  svg.track { position:absolute; inset:0; width:100%; height:100% }
  svg.profile { width:100%; height:5rem; display:block; margin:.4rem 0 }
  button[disabled] { opacity:.55; cursor:progress }
</style>
<nav class="topnav">
  <a href="/">Aujourd'hui</a>
  <a href="/seances">Séances</a>
  <a href="/chat">Discussions</a>
  <a href="/plan">Plan</a>
  <a href="/profil">Profil</a>
  <a href="/jobs">En cours</a>
</nav>
<main>__BODY__</main>
<script>
async function post(action, payload, el) {
  el.textContent = "saving…"; el.className = "note";
  try {
    const r = await fetch("/api/" + action, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (!r.ok || j.error) { el.textContent = j.error || ("HTTP " + r.status); el.className = "note warn"; return false; }
    el.textContent = j.message || "saved"; el.className = "note saved";
    return true;
  } catch (e) { el.textContent = String(e); el.className = "note warn"; return false; }
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-action]");
  if (!b) return;
  // A button may stand alone (a row's "archive"), so there need not be a card.
  const card = b.closest("[data-card]");
  const payload = {};
  if (card) card.querySelectorAll("[data-field]").forEach(i => {
    payload[i.dataset.field] = i.value === "" ? null : i.value;
  });
  // data-arg-* on the button itself, for actions whose whole payload is an id.
  for (const [k, v] of Object.entries(b.dataset)) {
    if (k.startsWith("arg")) payload[k.slice(3).toLowerCase()] = v;
  }
  // A minute or two is normal for anything that asks Claude, so say so rather
  // than looking hung. Without this the page appears frozen and gets reloaded
  // mid-run, which wastes the answer.
  if (b.dataset.slow) b.disabled = true;
  const status = (card || b.parentElement).querySelector("[data-status]")
              || b.insertAdjacentElement("afterend", Object.assign(
                   document.createElement("span"), {className: "note"}));
  if (b.dataset.slow) status.textContent = "en cours… (une minute ou deux)";

  // Chat keeps its thread on the page rather than reloading it away.
  if (b.dataset.action === "chat") {
    const chat = b.closest("[data-chat]");
    const box = chat.querySelector("[data-field=message]");
    // On the full-screen chat page the transcript is a sibling of the card, not
    // a child, so scoping the lookup to the card found nothing and every send
    // died on a null — silently, which is why the button appeared to do
    // nothing at all.
    const transcript = chat.querySelector("[data-transcript]")
                    || document.querySelector("[data-transcript]");
    if (!transcript) { status.textContent = "transcript introuvable"; b.disabled = false; return; }
    const asked = (box.value || "").trim();
    if (!asked) { status.textContent = "…?"; b.disabled = false; return; }
    payload.session_id = chat.dataset.session || null;
    say(transcript, "you", asked);
    box.value = "";
    b.disabled = true; status.textContent = "…";
    // A live pane, replaced each poll, showing the answer as it forms and which
    // queries have run. Removed when the real turn is appended.
    // A running account of what it is doing, expanded while it works. The wait
    // is a minute or two and the old status line said only how many seconds had
    // passed, which is not information. This is collapsed to a single line the
    // moment the answer arrives: it was scaffolding, and the answer is the point.
    let live = null;
    const r = await ask(payload, (secs, s) => {
      if (secs === null) { status.textContent = "…"; return; }
      status.textContent = `réflexion… ${secs}s`;
      const steps = (s && s.steps) || [];
      if (!steps.length && !(s && s.partial)) return;
      if (!live) {
        live = document.createElement("div");
        live.className = "reflection";
        transcript.appendChild(live);
      }
      live.replaceChildren(...steps.map(st => {
        const el = document.createElement("div");
        el.className = "step " + st.kind;
        el.textContent = st.text;
        if (st.detail) {
          const d = document.createElement("code");
          d.textContent = st.detail;
          el.appendChild(d);
        }
        return el;
      }));
      transcript.scrollTop = transcript.scrollHeight;
    });
    if (live) live.remove();
    b.disabled = false;
    if (r.error) { status.textContent = r.error; status.className = "note warn"; return; }
    status.textContent = ""; 
    if (r.session_id) chat.dataset.session = r.session_id;
    say(transcript, "claude", r.reply, r.queries, r.steps, r.changes);
    return;
  }

  if (b.dataset.confirm && !confirm(b.dataset.confirm)) {
    b.disabled = false; status.textContent = ""; return;
  }

  if (b.dataset.retry && !confirm(
        "Réécrire cette question ? La réponse et tous les échanges suivants de "
        + "cette conversation seront supprimés.")) {
    b.disabled = false;
    status.textContent = "";
    return;
  }

  // Slow buttons take the same polling path; fast ones stay a single request.
  if (b.dataset.slow) {
    // A visible, growing account rather than one small line. Analysing takes a
    // minute or two, and the old feedback was easy to miss on a phone — which
    // read as the button doing nothing at all.
    const panel = document.createElement("div");
    panel.className = "reflection";
    b.insertAdjacentElement("afterend", panel);
    const r = await run(b.dataset.action, payload, (secs, s) => {
      status.textContent = secs === null ? "…" : `en cours… ${secs}s`;
      const steps = (s && s.steps) || [];
      panel.replaceChildren(...(steps.length ? steps : [{kind: "text",
          text: "démarrage — l'analyse tourne même si tu quittes la page"}]
        ).map(st => {
        const el = document.createElement("div");
        el.className = "step " + st.kind;
        el.textContent = st.text;
        if (st.detail) {
          const d = document.createElement("code");
          d.textContent = st.detail;
          el.appendChild(d);
        }
        return el;
      }));
    });
    panel.remove();
    b.disabled = false;
    if (r.error) { status.textContent = r.error; status.className = "note warn"; return; }
    status.textContent = r.message || "fait"; status.className = "note saved";
    if (b.dataset.reload) setTimeout(() => location.reload(), 600);
    return;
  }

  const ok = await post(b.dataset.action, payload, status);
  if (ok && b.dataset.reload) setTimeout(() => location.reload(), 400);
});

// Slow actions return a handle, not an answer. Polling short requests survives
// a screen lock, an app switch and a moment of bad signal, none of which a
// two-minute connection does — that failure arrived as "TypeError: Load failed"
// with the work already running, and the answer already stored.
async function run(action, payload, onTick) {
  let started;
  try {
    const r = await fetch("/api/" + action, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    started = await r.json();
    if (started.error) return started;
  } catch (e) { return {error: String(e)}; }

  const job = started.job;
  if (!job) return started;                       // fast action, already done

  for (let i = 0; i < 300; i++) {                 // 300 × 2s = 10 minutes
    await new Promise(r => setTimeout(r, 2000));
    let s;
    try {
      s = await (await fetch("/api/job?id=" + encodeURIComponent(job))).json();
    } catch (e) {
      // A blip while polling is not a failure: the work continues server-side.
      if (onTick) onTick(null);
      continue;
    }
    if (s.state === "running") { if (onTick) onTick(s.elapsed, s); continue; }
    if (s.state === "done") return s.result || {};
    return {error: s.error || "échec"};
  }
  return {error: "toujours en cours après 10 min — recharge la page, la réponse "
                 + "y sera si elle a abouti"};
}

async function ask(payload, onTick) {
  return await run("chat", payload, onTick);
}

function say(transcript, who, text, queries, steps, changes) {
  const el = document.createElement("div");
  el.className = "turn " + who;
  // textContent, never innerHTML: the reply is model output and the question is
  // typed by hand, and neither should be able to put markup in this page.
  el.textContent = text;
  // What it changed, stated plainly and never folded away. The reasoning is
  // scaffolding and collapses; a write to his own record is not.
  if (changes && changes.length) {
    const box = document.createElement("div");
    box.className = "changes";
    box.textContent = changes.length === 1 ? "Modifié :" : "Modifié :";
    for (const c of changes) {
      const li = document.createElement("div");
      li.className = "change";
      li.textContent = c.summary;
      box.appendChild(li);
    }
    el.appendChild(box);
  }
  if (steps && steps.length) {
    // Kept, but folded away. Worth having when an answer looks wrong and you
    // want to see what it read; worth hiding the rest of the time.
    const d = document.createElement("details");
    d.className = "reflection done";
    const sum = document.createElement("summary");
    sum.textContent = `raisonnement — ${steps.length} étape(s)`;
    d.appendChild(sum);
    for (const st of steps) {
      const s = document.createElement("div");
      s.className = "step " + st.kind;
      s.textContent = st.text;
      if (st.detail) {
        const c = document.createElement("code");
        c.textContent = st.detail;
        s.appendChild(c);
      }
      d.appendChild(s);
    }
    el.appendChild(d);
  } else if (queries && queries.length) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = queries.length + " requête(s) : " + queries.join(", ");
    el.appendChild(note);
  }
  transcript.appendChild(el);
  transcript.scrollTop = transcript.scrollHeight;
}

// Rewriting a question. The later answers were formed partly from the wording
// being changed, so they go — which is worth asking about before it happens.
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-edit]");
  if (b) {
    const chat = b.closest("[data-chat]") || document.querySelector("[data-chat]");
    chat.querySelector("[data-field=message]").value = b.dataset.question;
    chat.querySelector("[data-field=turn_id]").value = b.dataset.edit;
    chat.querySelector("[data-chat-send]").hidden = true;
    chat.querySelector("[data-retry]").hidden = false;
    chat.querySelector("[data-cancel-edit]").hidden = false;
    chat.querySelector("[data-field=message]").focus();
    return;
  }
  const c = e.target.closest("button[data-cancel-edit]");
  if (c) {
    const chat = c.closest("[data-chat]");
    chat.querySelector("[data-field=message]").value = "";
    chat.querySelector("[data-field=turn_id]").value = "";
    chat.querySelector("[data-chat-send]").hidden = false;
    chat.querySelector("[data-retry]").hidden = true;
    c.hidden = true;
  }
});

// The tile grid is laid out at natural pixel size and scaled to fit, so the
// track and the roads stay in step at any width. Done here rather than in CSS
// because the scale depends on the grid's own dimensions.
function fitMaps() {
  document.querySelectorAll(".mapwrap").forEach(w => {
    const g = w.querySelector(".tiles");
    if (!g) return;
    const natural = parseFloat(g.style.width);
    if (!natural) return;
    g.style.transform = `scale(${w.clientWidth / natural})`;
  });
}
addEventListener("resize", fitMaps);
addEventListener("DOMContentLoaded", fitMaps);
fitMaps();

// Cmd/Ctrl+Enter sends. Plain Enter stays a newline: there is no shift-enter on
// an iOS keyboard, so binding Enter to send made it impossible to write a
// multi-line question on the device this is mostly read on.
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
  const box = e.target.closest("textarea[data-field=message]");
  if (!box) return;
  e.preventDefault();
  box.closest("[data-chat]").querySelector("[data-chat-send]").click();
});
</script>
