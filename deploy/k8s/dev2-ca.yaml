# The Dev2 root certificate, so oauth2-proxy can verify Authelia — that image
# does not trust an internal CA, and without this every token exchange fails on
# TLS verification.
#
# A ConfigMap, not a Secret: a CA certificate is public by construction. It is
# committed for the same reason.
#
# Regenerate from the CA repo with:
#   kubectl create configmap dev2-ca --namespace apple-health \
#     --from-file=ca.cert.pem=/Volumes/nicolas-data/Repositories/CA/2025/certs/ca.cert.pem \
#     --dry-run=client -o yaml > deploy/k8s/dev2-ca.yaml
